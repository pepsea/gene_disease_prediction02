[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "target_loop"
version = "0.1.0"
description = "Training-free, LLM-knowledge-driven drug-target candidate discovery loop (seed -> expand -> verify -> classify)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
llama = ["llama-cpp-python>=0.3"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["target_loop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
